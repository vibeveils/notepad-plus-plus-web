<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notepad++">
<link rel="apple-touch-icon" href="img/npp-256.png">
<title>new 1 - Notepad++</title>
<meta name="description" content="Notepad++'s Scintilla and Lexilla editing engine compiled to WebAssembly, with a Notepad++ style interface.">
<meta name="theme-color" content="#f0f0f0">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/sci.css">
<link rel="stylesheet" href="css/npp.css">
</head>
<body>
<div id="app" class="booting">
  <div id="menubar" role="menubar"></div>
  <div id="toolbar" role="toolbar"></div>
  <div id="tabbar" role="tablist"></div>
  <div id="editor-area">
    <div id="editor"></div>
  </div>
  <div id="results-panel" class="panel" hidden>
    <div class="panel-head"><span class="panel-title">Search results</span><button class="panel-close" title="Close">✕</button></div>
    <div class="panel-body"></div>
  </div>
  <div id="keybar" role="toolbar" aria-label="Extra keys"></div>
  <div id="statusbar">
    <div class="sb" id="sb-lang"></div>
    <div class="sb" id="sb-size"></div>
    <div class="sb" id="sb-pos"></div>
    <div class="sb sb-click" id="sb-eol" title="Click to change line endings"></div>
    <div class="sb sb-click" id="sb-enc" title="Click to change encoding"></div>
    <div class="sb sb-click" id="sb-ins" title="Click to toggle insert / overtype"></div>
  </div>
  <div id="search-host" aria-hidden="true"></div>
</div>
<div id="touchbar" role="toolbar" aria-label="Selection" hidden></div>
<div id="boot">
  <img src="img/npp-256.png" alt="" width="96" height="96">
  <div id="boot-text">Loading Notepad++…</div>
</div>
<input type="file" id="file-input" multiple hidden>
<noscript>Notepad++ for the web needs JavaScript and WebAssembly.</noscript>
<script src="npp.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
